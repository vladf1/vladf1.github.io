<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swarm 2 WebGPU Benchmark</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #050506;
        color: #f1f5f9;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #050506;
      }

      main {
        width: min(1080px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 32px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 24px;
        line-height: 1.2;
      }

      .description {
        margin: -6px 0 16px;
        color: #94a3b8;
        font-size: 13px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: end;
        margin-bottom: 16px;
      }

      label {
        display: grid;
        gap: 5px;
        color: #cbd5e1;
        font-size: 13px;
        font-weight: 700;
      }

      input,
      button {
        box-sizing: border-box;
        height: 36px;
        border-radius: 6px;
        font: inherit;
      }

      input {
        width: 116px;
        padding: 7px 9px;
        color: #f8fafc;
        background: #111827;
        border: 1px solid #334155;
      }

      button {
        padding: 0 14px;
        color: #06111f;
        background: #7df9ff;
        border: 1px solid #7df9ff;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      #status {
        min-height: 22px;
        margin: 0 0 14px;
        color: #f4ff28;
        font-size: 14px;
      }

      .results {
        display: grid;
        grid-template-columns: 1.4fr repeat(2, 1fr);
        overflow: hidden;
        border: 1px solid #1f2937;
        border-radius: 8px;
        background: #111827;
      }

      .metric {
        padding: 16px;
        border-left: 1px solid #1f2937;
      }

      .metric:first-child {
        border-left: 0;
      }

      .metric-label {
        display: block;
        margin-bottom: 7px;
        color: #cbd5e1;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .metric-value {
        font-size: 22px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .score .metric-value {
        color: #7df9ff;
        font-size: 34px;
      }

      .preview {
        margin-top: 16px;
      }

      .preview canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        background: black;
        border: 1px solid #1f2937;
        border-radius: 8px;
      }

      @media (max-width: 720px) {
        main {
          width: min(100vw - 20px, 540px);
          padding-top: 16px;
        }

        .results {
          grid-template-columns: 1fr;
        }

        .metric,
        .metric:first-child {
          border: 0;
          border-top: 1px solid #1f2937;
        }

        .metric:first-child {
          border-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Swarm 2 WebGPU Benchmark</h1>
      <p class="description">Score is median implied FPS after warm-up. Compare runs with identical settings.</p>
      <div class="controls">
        <label>
          Sprites
          <input id="spriteCount" type="number" min="10" step="1000" />
        </label>
        <label>
          Frames
          <input id="frameCount" type="number" min="10" step="10" />
        </label>
        <label>
          Width
          <input id="canvasWidth" type="number" min="160" step="80" />
        </label>
        <label>
          Height
          <input id="canvasHeight" type="number" min="120" step="60" />
        </label>
        <button id="runButton" type="button">Run</button>
      </div>
      <p id="status"></p>
      <section class="results" aria-label="Benchmark result">
        <div class="metric score">
          <span class="metric-label">WebGPU score · implied FPS · higher is better</span>
          <span class="metric-value" id="score">—</span>
        </div>
        <div class="metric">
          <span class="metric-label">Median frame time</span>
          <span class="metric-value" id="medianFrameTime">—</span>
        </div>
        <div class="metric">
          <span class="metric-label">Sample range</span>
          <span class="metric-value" id="sampleRange">—</span>
        </div>
      </section>
      <div class="preview">
        <canvas id="webgpuCanvas" aria-label="WebGPU benchmark preview"></canvas>
      </div>
    </main>
    <script type="module" src="./swarm-benchmark.js"></script>
  </body>
</html>
