<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Swarm 3</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
        color: white;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      body,
      canvas {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: black;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      #stats {
        position: fixed;
        left: 14px;
        top: 14px;
        z-index: 2;
        min-height: 20px;
        padding: 5px 8px;
        box-sizing: border-box;
        color: #f4ff28;
        background: rgb(0 0 0 / 58%);
        border: 1px solid rgb(244 255 40 / 28%);
        border-radius: 6px;
        font: 13px/1.2 Arial, Helvetica, sans-serif;
        pointer-events: none;
        white-space: pre;
        text-shadow: 0 1px 2px black;
      }

      #hint {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #7df9ff;
        font: 500 42px/1.15 "Avenir Next", "Segoe UI", Verdana, sans-serif;
        text-align: center;
        pointer-events: none;
        text-shadow:
          0 0 8px rgb(125 249 255 / 35%),
          0 0 18px rgb(255 255 40 / 20%);
        transition:
          opacity 2s ease,
          transform 2s ease;
      }

      #hint.is-fading {
        opacity: 0;
        transform: translateY(48px);
      }

      #notice {
        position: fixed;
        left: 50%;
        top: 86px;
        z-index: 4;
        padding: 8px 12px;
        color: #f4ff28;
        background: rgb(0 0 0 / 72%);
        border: 1px solid rgb(244 255 40 / 38%);
        border-radius: 7px;
        font: 700 14px/1.2 Arial, Helvetica, sans-serif;
        opacity: 0;
        pointer-events: none;
        text-shadow: 0 1px 2px black;
        transform: translate(-50%, -8px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      #notice.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      #controls {
        position: fixed;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: max-content;
        max-width: calc(100vw - 28px);
        padding: 8px 10px;
        transform: translateX(-50%);
        box-sizing: border-box;
        color: #eeeeee;
        background: rgb(18 20 24 / 86%);
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 8px;
        box-shadow:
          0 16px 42px rgb(0 0 0 / 50%),
          inset 0 1px 0 rgb(255 255 255 / 8%);
        backdrop-filter: blur(12px);
        font: 13px/1.2 Arial, Helvetica, sans-serif;
        user-select: none;
      }

      .control-field {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .control-field input:focus-visible {
        outline: 2px solid #f4ff28;
        outline-offset: 2px;
      }

      .control-field span {
        color: #d2d2d2;
        font-weight: 700;
      }

      .control-field input[type="number"] {
        width: 88px;
      }

      .control-field input[type="number"] {
        padding: 7px 8px;
        color: #eeeeee;
        background: rgb(0 0 0 / 38%);
        border: 1px solid rgb(255 255 255 / 28%);
        border-radius: 6px;
        font: inherit;
      }

      .control-field input[type="range"] {
        width: 126px;
        accent-color: #f4ff28;
      }

      .render-mode-group {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        isolation: isolate;
      }

      .control-button {
        min-width: 70px;
        padding: 8px 12px;
        color: #dffbff;
        border: 1px solid rgb(125 249 255 / 58%);
        border-radius: 7px;
        background: rgb(10 42 52 / 90%);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .render-mode-group .control-button {
        min-width: 76px;
        padding-inline: 10px;
        color: #eeeeee;
        border-color: rgb(255 255 255 / 28%);
        border-radius: 0;
        background: rgb(0 0 0 / 32%);
        box-shadow: none;
      }

      .render-mode-group .control-button + .control-button {
        margin-left: -1px;
      }

      .render-mode-group .control-button:first-child {
        border-top-left-radius: 6px;
        border-bottom-left-radius: 6px;
      }

      .render-mode-group .control-button:last-child {
        border-top-right-radius: 6px;
        border-bottom-right-radius: 6px;
      }

      .render-mode-group .control-button:hover {
        position: relative;
        z-index: 1;
        color: #f8ffff;
        border-color: rgb(244 255 40 / 58%);
        background: rgb(244 255 40 / 12%);
      }

      .render-mode-group .control-button[aria-pressed="true"] {
        position: relative;
        z-index: 2;
        color: #120f00;
        border-color: rgb(244 255 40 / 92%);
        background: rgb(244 255 40 / 92%);
      }

      .render-mode-group .control-button[aria-pressed="true"]:hover {
        color: #120f00;
        border-color: #fff77a;
        background: #fff77a;
      }

      .control-button:hover {
        color: white;
        border-color: rgb(125 249 255 / 86%);
        background: rgb(18 72 88 / 94%);
      }

      .control-button[aria-pressed="true"] {
        color: #1e1700;
        border-color: rgb(244 255 40 / 92%);
        background: rgb(244 255 40 / 92%);
      }

      .control-button[aria-pressed="true"]:hover {
        color: #120f00;
        border-color: #fff77a;
        background: #fff77a;
      }

      .control-button.secondary {
        color: #eeeeee;
        border-color: rgb(255 255 255 / 28%);
        background: rgb(0 0 0 / 32%);
      }

      .control-button.secondary:hover {
        border-color: rgb(244 255 40 / 55%);
        background: rgb(244 255 40 / 12%);
      }

      .control-button:focus-visible {
        outline: 2px solid #f4ff28;
        outline-offset: 2px;
      }

      @media (max-width: 640px) {
        #hint {
          font-size: 32px;
        }

        #controls {
          flex-wrap: wrap;
          justify-content: flex-start;
          width: calc(100vw - 28px);
        }

        .control-field input[type="range"] {
          width: min(130px, 34vw);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="swarm" aria-label="Pretty Swarm canvas"></canvas>
    <div id="stats"></div>
    <div id="hint">Worms love apples. Tap to plant one. Shift-click places repellents.</div>
    <div id="notice" role="status" aria-live="polite"></div>
    <div id="controls">
      <button id="pauseButton" class="control-button" type="button" aria-pressed="false">Pause</button>
      <button id="resetApplesButton" class="control-button secondary" type="button">Reset</button>
      <div class="render-mode-group" role="group" aria-label="Render mode">
        <button id="linesModeButton" class="control-button" type="button" aria-pressed="true">Lines</button>
        <button id="trianglesModeButton" class="control-button" type="button" aria-pressed="false">Triangles</button>
      </div>
      <label class="control-field">
        <span>Worms</span>
        <input id="wormCount" type="number" min="10" max="2000000" step="1000" />
      </label>
      <label class="control-field">
        <span>Craziness</span>
        <input id="craziness" type="range" min="0" max="3" step="0.05" />
      </label>
      <label class="control-field">
        <span>Speed</span>
        <input id="speed" type="range" min="0.1" max="3" step="0.05" />
      </label>
    </div>
    <script>
      if (location.protocol === "http:" && !["localhost", "127.0.0.1", "::1"].includes(location.hostname)) {
        location.replace(`https:${location.href.slice(location.protocol.length)}`);
      }
    </script>
    <script type="module" src="./swarm-3.ts"></script>
  </body>
</html>
