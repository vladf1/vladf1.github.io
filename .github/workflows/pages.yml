name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: old-projects/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix old-projects

      - name: Build TypeScript ports
        run: npm run build --prefix old-projects

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='**/node_modules/' \
            --exclude='**/dist/' \
            --exclude='old-projects/*-silverlight-port/assets/'
          cp -R old-projects/fireworks-silverlight-port/dist/. _site/old-projects/fireworks-silverlight-port/
          cp -R old-projects/swarm-silverlight-port/dist/. _site/old-projects/swarm-silverlight-port/
          cp -R old-projects/vector-defence-silverlight-port/dist/. _site/old-projects/vector-defence-silverlight-port/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
