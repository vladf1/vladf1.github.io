    <h3>Silverlight to TypeScript ports</h3>

    <a href="old-projects/swarm-silverlight-port/">swarm</a>
    <a href="old-projects/magic-trails-silverlight-port/">magic trails</a>

    <script type="module">
        function swing(progress) {
            return 0.5 - Math.cos(progress * Math.PI) / 2;
        }

        function currentValue(element, property) {
            if (property == "scrollTop") {
                return element.scrollTop;
            }

            return parseFloat(getComputedStyle(element)[property]) || 0;
        }

        function setValue(element, property, value) {
            if (property == "scrollTop") {
                element.scrollTop = value;
            }
            else {
                element.style[property] = value + "px";
            }
        }

        function wait(duration) {
            return new Promise(function (resolve) {
                setTimeout(resolve, duration);
            });
        }

        function animate(element, properties, duration) {
            var starts = {};
            var changes = {};

            Object.keys(properties).forEach(function (property) {
                starts[property] = currentValue(element, property);
                changes[property] = properties[property] - starts[property];
            });

            return new Promise(function (resolve) {
                var startTime = performance.now();

                function tick() {
                    var progress = Math.min((performance.now() - startTime) / duration, 1);
                    var eased = swing(progress);

                    Object.keys(properties).forEach(function (property) {
                        setValue(element, property, starts[property] + changes[property] * eased);
                    });

                    if (progress < 1) {
                        setTimeout(tick, 13);
                    }
                    else {
                        resolve();
                    }
                }

                tick();
            });
        }

        async function animateIfIdle(div, action) {
            if (div.isAnimating) {
                return;
            }

            div.isAnimating = true;
            try {
                await action(div);
            }
            finally {
                div.isAnimating = false;
            }
        }

        var SIZE = 90;

        var divSize = SIZE - 2;
        var allLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ?!";
        var html = "";
        for (var i = 0; i < allLetters.length; i++) {
            var h = "<div style='height: " + divSize + "px; width: " + divSize + "px; font-size: " + (SIZE - 9) + "px;'>" + allLetters.charAt(i) + "</div>";
            html += h;
        }

        var letterHeight = SIZE + 2;
        var str = "HI  THERE!!";

        var wh = window.innerHeight;
        var ww = window.innerWidth;


        function randomInRange(minVal, maxVal) {
            return minVal + (Math.random() * (maxVal - minVal));
        }

        function randomY() {
            return Math.floor(Math.random() * (wh - SIZE));
        }

        function randomX() {
            return Math.floor(Math.random() * (ww - SIZE));
        }

        function randomOffsetX(n) {
            var v = randomInRange(n - 200, n + 200);
            if (v > ww - SIZE)
                v = ww - SIZE - 2;
            if (v < 2)
                v = 2;
            return v;
        }

        function randomOffsetY(n) {
            var v = randomInRange(n - 200, n + 200);
            if (v > wh - SIZE)
                v = wh - SIZE - 2;
            if (v < 2)
                v = 2;
            return v;
        }

        function chooseRandom(div, excludedValue) {
            var scrollTo;
            do {
                scrollTo = Math.floor(Math.random() * allLetters.length) * letterHeight;
            }
            while (scrollTo == excludedValue);
            return scrollTo;
        }

        document.addEventListener("DOMContentLoaded", function () {
            document.body.onselectstart = function () { return false; };

            var numberOfSpaces = str.match(/\s/g).length;
            var numberOfLetters = str.length - numberOfSpaces;
            var textWidth = numberOfLetters * (SIZE + 5) + numberOfSpaces * 15;

            var x = (ww - textWidth) / 2;
            if (x < 0) {
                x = 0;
            }
            var originalTop = (wh - SIZE) / 2;

            for (var i = 0; i < str.length; i++) {
                var c = str.charAt(i);
                if (c != " ") {
                    var div = document.createElement("DIV");
                    div.className = "wheel";
                    div.style.height = SIZE + "px";
                    div.innerHTML = html; // add letters
                    div.correctScroll = allLetters.indexOf(c) * letterHeight;

                    div.style.left = x + "px";
                    div.style.top = originalTop + "px";
                    div.originalLeft = x;

                    document.body.appendChild(div);

                    div.scrollTop = chooseRandom(div, div.correctScroll);   // scroll to the correct letter

                    x += (SIZE + 5);
                }
                else {
                    x += 15;
                }
            }

            var wheels = document.querySelectorAll("div.wheel");

            async function startWheel(div) {
                var x1 = randomOffsetX(div.originalLeft);
                var y1 = randomOffsetY(originalTop);

                var x2 = randomOffsetX(x1);
                var y2 = randomOffsetY(y1);

                var x3 = randomOffsetX(x2);
                var y3 = randomOffsetY(y2);

                await wait(200);
                await animate(div, { scrollTop: div.correctScroll }, 2000);
                await wait(500);
                await animate(div, { "left": x1, "top": y1 }, randomInRange(500, 1000));
                await animate(div, { "left": x2, "top": y2 }, randomInRange(500, 1000));
                await animate(div, { "left": x3, "top": y3 }, randomInRange(500, 1000));
                await animate(div, { "left": div.originalLeft, "top": originalTop }, randomInRange(500, 1000));
            }

            async function scatterWheel(div) {
                await animate(div, { "left": randomX(), "top": randomY() }, randomInRange(500, 1000));
                await animate(div, { "left": randomX(), "top": randomY() }, randomInRange(500, 1000));
                await animate(div, { "left": randomX(), "top": randomY() }, randomInRange(500, 1000));
                await animate(div, { "left": div.originalLeft, "top": originalTop }, randomInRange(500, 1000));
            }

            async function spinWheel(div) {
                await animate(div, { scrollTop: chooseRandom(div, div.scrollTop) }, randomInRange(1000, 1500));
                await wait(500);
                await animate(div, { scrollTop: div.correctScroll }, randomInRange(1000, 1500));
            }

            for (var i = 0; i < wheels.length; i++) {
                animateIfIdle(wheels[i], startWheel);
            }

            document.addEventListener("dblclick", function () {
                for (var i = 0; i < wheels.length; i++) {
                    var div = wheels[i];
                    animateIfIdle(div, scatterWheel);
                }
            });

            for (var i = 0; i < wheels.length; i++) {
                var div = wheels[i];
                div.addEventListener("click", function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    animateIfIdle(this, spinWheel);
                });
            }
        });
    </script>
</body>
