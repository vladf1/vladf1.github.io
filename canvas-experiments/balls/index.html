<!DOCTYPE html>
<html>
<head>

    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <meta name="viewport" content="width=device-width, initial-scale = 1, user-scalable=no">

    <script src="/shared/frame-counter.js"></script>
