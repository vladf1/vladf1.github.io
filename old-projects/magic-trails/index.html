<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magic Trails</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      body,
      canvas {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      #hint {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #7df9ff;
        font: 500 48px "Avenir Next", "Segoe UI", Verdana, sans-serif;
        line-height: 1.15;
        padding: 32px;
        pointer-events: none;
        text-align: center;
        text-shadow:
          0 0 8px rgb(125 249 255 / 35%),
          0 0 18px rgb(255 79 216 / 18%);
        transition:
          opacity 2.5s ease,
          transform 2.5s ease;
      }

      #hint.is-fading {
        opacity: 0;
        transform: translateY(60px);
      }
    </style>
  </head>
  <body>
    <canvas id="trails"></canvas>
    <div id="hint">Tap or move to start</div>
    <script src="./magic-trails.js"></script>
  </body>
</html>
