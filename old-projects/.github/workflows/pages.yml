name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vector-defence-classic-port/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix vector-defence-classic-port

      - name: Build
        run: npm run build --prefix vector-defence-classic-port

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages/balls pages/vector-defence-classic-port
          cp index.html pages/index.html
          cp -R balls/. pages/balls/
          cp -R vector-defence-classic-port/dist/. pages/vector-defence-classic-port/

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
