name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            magic-trails-silverlight-port/package-lock.json
            fireworks-silverlight-port/package-lock.json
            vector-defence-silverlight-port/package-lock.json
            swarm-silverlight-port/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix magic-trails-silverlight-port
          npm ci --prefix fireworks-silverlight-port
          npm ci --prefix vector-defence-silverlight-port
          npm ci --prefix swarm-silverlight-port

      - name: Build
        run: |
          npm run build --prefix magic-trails-silverlight-port
          npm run build --prefix fireworks-silverlight-port
          npm run build --prefix vector-defence-silverlight-port
          npm run build --prefix swarm-silverlight-port

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages/balls pages/click-me pages/magic-trails-silverlight-port pages/fireworks-silverlight-port pages/js-fireworks pages/shared pages/shoot-them-down pages/spaceship pages/swarm pages/swarm-silverlight-port pages/vector-defence-silverlight-port
          cp index.html pages/index.html
          cp -R balls/. pages/balls/
          cp -R click-me/. pages/click-me/
          cp -R magic-trails-silverlight-port/dist/. pages/magic-trails-silverlight-port/
          cp -R fireworks-silverlight-port/dist/. pages/fireworks-silverlight-port/
          cp -R js-fireworks/. pages/js-fireworks/
          cp -R shared/. pages/shared/
          cp -R shoot-them-down/. pages/shoot-them-down/
          cp -R spaceship/. pages/spaceship/
          cp -R swarm/. pages/swarm/
          cp -R swarm-silverlight-port/dist/. pages/swarm-silverlight-port/
          cp -R vector-defence-silverlight-port/dist/. pages/vector-defence-silverlight-port/

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
